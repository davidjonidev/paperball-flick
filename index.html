<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2b6cb0" />
    <meta name="description" content="Flick the paper ball into the trash. Mind the wind!" />

    <!-- PWA / iOS home-screen support -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Paper Flick" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />

    <title>Paper Flick — Paper Ball Toss</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="ui">
        <div id="hud-top">
          <div id="score" class="pill">Score 0</div>
          <div id="wind" class="pill calm">Wind: calm</div>
        </div>
        <div id="substat">Streak 0 · Best 0</div>
        <div id="fps" class="hidden">– fps</div>
        <div id="hint">↑ flick up · curve your swipe to add spin</div>
        <div id="result"></div>
        <div id="controls">
          <button id="fpsBtn" class="ctrl" aria-label="Toggle FPS counter">FPS</button>
          <button id="muteBtn" class="ctrl" aria-label="Toggle sound">🔊</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
