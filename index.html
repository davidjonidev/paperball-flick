<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2b6cb0" />
    <meta name="description" content="Flick the paper ball into the trash. Mind the wind!" />

    <!-- PWA / iOS home-screen support -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Paper Flick" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />

    <title>Paper Flick — Paper Ball Toss</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="ui">
        <div id="hud-top">
          <div id="score" class="pill">Score 0</div>
          <div id="wind" class="pill calm">Wind: calm</div>
        </div>
        <div id="substat">Streak 0 · Best 0</div>
        <div id="fps" class="hidden">– fps</div>
        <div id="hint">↑ swipe up to flick</div>
        <div id="result"></div>
        <div id="controls">
          <button id="fpsBtn" class="ctrl" aria-label="Toggle FPS counter">FPS</button>
          <button id="muteBtn" class="ctrl" aria-label="Toggle sound">🔊</button>
          <button id="pauseBtn" class="ctrl" aria-label="Pause">⏸</button>
        </div>
      </div>

      <div id="menu" class="overlay">
        <div class="card">
          <h1>Paper&nbsp;Flick</h1>
          <p class="tag">Swipe up to toss the paper ball in the bin — mind the wind!</p>
          <div class="seglabel">Difficulty</div>
          <div class="seg" id="diffSeg">
            <button data-diff="easy">Easy</button>
            <button data-diff="normal">Normal</button>
            <button data-diff="hard">Hard</button>
          </div>
          <button id="playBtn" class="primary">Play</button>
          <p class="best" id="menuBest">Best 0</p>
        </div>
      </div>

      <div id="pause" class="overlay hidden">
        <div class="card">
          <h2>Paused</h2>
          <button id="resumeBtn" class="primary">Resume</button>
          <button id="restartBtn">Restart level run</button>
          <button id="menuBtn">Main menu</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
